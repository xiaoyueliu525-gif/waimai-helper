<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">
  <title>我的 - 外卖省钱助手</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app profile-app">
    <header class="profile-header">
      <div class="profile-user">
        <div class="profile-avatar" id="profileAvatar">😋</div>
        <div class="profile-info">
          <h1 class="profile-name" id="profileName">美食探索家</h1>
          <p class="profile-phone" id="profilePhone">138****8888</p>
        </div>
        <button class="profile-edit" id="editProfile" aria-label="编辑资料">编辑</button>
      </div>

      <div class="profile-stats">
        <a href="orders.html" class="stat-item">
          <span class="stat-num" id="statOrders">0</span>
          <span class="stat-label">订单</span>
        </a>
        <a href="coupons.html" class="stat-item">
          <span class="stat-num" id="statCoupons">0</span>
          <span class="stat-label">优惠券</span>
        </a>
        <div class="stat-item">
          <span class="stat-num" id="statSaved">0</span>
          <span class="stat-label">已省(元)</span>
        </div>
      </div>
    </header>

    <a href="addresses.html" class="profile-address" id="profileAddress">
      <span class="address-icon">📍</span>
      <div class="address-info">
        <div class="address-label">默认地址</div>
        <div class="address-text" id="defaultAddressText">加载中...</div>
      </div>
      <span class="address-arrow">›</span>
    </a>

    <section class="profile-menu">
      <a href="orders.html" class="menu-row">
        <span class="menu-icon">📋</span>
        <span class="menu-label">我的订单</span>
        <span class="menu-badge" id="deliveringBadge" hidden></span>
        <span class="menu-arrow">›</span>
      </a>
      <a href="coupons.html" class="menu-row">
        <span class="menu-icon">🎫</span>
        <span class="menu-label">红包优惠券</span>
        <span class="menu-arrow">›</span>
      </a>
      <a href="addresses.html" class="menu-row">
        <span class="menu-icon">📍</span>
        <span class="menu-label">收货地址</span>
        <span class="menu-arrow">›</span>
      </a>
      <button class="menu-row" id="btnHelp">
        <span class="menu-icon">💬</span>
        <span class="menu-label">联系客服</span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-row" id="btnSettings">
        <span class="menu-icon">⚙️</span>
        <span class="menu-label">设置</span>
        <span class="menu-arrow">›</span>
      </button>
    </section>

    <section class="profile-recent">
      <div class="section-header">
        <h2 class="section-title">最近订单</h2>
        <a href="orders.html" class="section-more">全部 ›</a>
      </div>
      <div id="recentOrders">
        <div class="loading-spinner"></div>
      </div>
    </section>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="discover.html" class="nav-item" data-page="discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <span>发现</span>
      </a>
      <a href="coupons.html" class="nav-item" data-page="coupons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 12h20"/></svg>
        <span>优惠券</span>
      </a>
      <a href="profile.html" class="nav-item active" data-page="profile">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/address-store.js"></script>
  <script src="js/order-store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
