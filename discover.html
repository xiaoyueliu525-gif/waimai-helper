<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">

  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

      <span class="header-placeholder"></span>
    </header>

    <div class="discover-filters" id="categoryFilters">
      <button class="filter-chip active" data-category="all">全部</button>
      <!-- JS 渲染 -->

    <div class="discover-sort">
      <span class="active">综合排序</span>
      <span>距离最近</span>
      <span>销量最高</span>

    <div class="discover-list" id="merchantList">

        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="discover.html" class="nav-item active" data-page="discover">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>发现</span>
      </a>
      <a href="coupons.html" class="nav-item" data-page="coupons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 12h20"/></svg>
        <span>优惠券</span>
      </a>
      <a href="profile.html" class="nav-item" data-page="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/discover.js"></script>

</html>
