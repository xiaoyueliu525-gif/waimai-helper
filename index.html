<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">
  <title>外卖省钱助手</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <button class="location" id="locationButton" type="button">
          <svg class="icon-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s-8-4.5-8-11a8 8 0 1 1 16 0c0 6.5-8 11-8 11z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="locationText">选择位置</span>
        </button>
        <a href="coupons.html" class="btn-coupon" aria-label="我的优惠券">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <path d="M2 12h20M9 6v12M15 6v12"/>
          </svg>
          <span class="coupon-badge" id="headerCouponBadge">0</span>
        </a>
      </div>

      <h1 class="greeting">
        <span class="greeting-sub">嗨，饿了吗？</span>
        <span class="greeting-main">今天吃什么</span>
      </h1>
    </header>

    <div class="modal-overlay" id="locationModal" hidden>
      <div class="modal location-modal">
        <h2 class="modal-title-lg">选择配送位置</h2>
        <p class="location-current" id="locationCurrent">暂未选择位置</p>
        <div class="location-actions">
          <button class="location-action" id="btnUseGps" type="button">
            <span class="location-action-icon">⌖</span>
            <span>
              <strong>使用当前位置</strong>
              <em>浏览器会请求一次定位权限</em>
            </span>
          </button>
          <button class="location-action" id="btnUseDefaultAddress" type="button">
            <span class="location-action-icon">⌂</span>
            <span>
              <strong>使用默认收货地址</strong>
              <em id="defaultAddressHint">从地址簿读取</em>
            </span>
          </button>
        </div>
        <div class="modal-actions">
          <a class="btn-secondary location-link" href="addresses.html">管理地址</a>
          <button class="btn-primary" id="btnCloseLocation" type="button">完成</button>
        </div>
      </div>
    </div>

    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3-3"/>
        </svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="搜索商家、菜品、优惠..."
          autocomplete="off"
        >
        <button class="search-btn" id="searchBtn">搜索</button>
      </div>
      <div class="hot-tags" id="hotTags">
        <!-- JS 渲染 -->
      </div>
    </section>

    <!-- 搜索结果 -->
    <section class="search-results" id="searchResults" hidden>
      <div class="section-header">
        <h2 class="section-title">搜索结果</h2>
        <button class="btn-text" id="clearSearch">清除</button>
      </div>
      <div id="searchResultsBody"></div>
    </section>

    <section class="lottery-section">
      <button class="lottery-btn" id="lotteryBtn">
        <div class="lottery-wheel">
          <span class="wheel-emoji">🎰</span>
        </div>
        <div class="lottery-text">
          <span class="lottery-title">不知道吃啥？</span>
          <span class="lottery-sub">点我随机抽奖决定</span>
        </div>
        <svg class="lottery-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </section>

    <!-- 抽奖弹窗 -->
    <div class="modal-overlay" id="lotteryModal" hidden>
      <div class="modal lottery-modal">
        <div class="modal-confetti" aria-hidden="true"></div>

        <!-- 老虎机阶段 -->
        <div class="lottery-phase" id="slotPhase">
          <p class="slot-label">正在为你挑选...</p>
          <div class="slot-machine">
            <div class="slot-pointer"></div>
            <div class="slot-window">
              <div class="slot-reel" id="slotReel"></div>
            </div>
          </div>
        </div>

        <!-- 结果阶段 -->
        <div class="lottery-phase lottery-result-phase" id="resultPhase" hidden>
          <div class="modal-emoji" id="modalEmoji">🍜</div>
          <h2 class="modal-title">今天就吃这个！</h2>
          <p class="modal-result" id="modalResult">兰州拉面</p>
          <p class="modal-tip" id="modalTip">附近 3 家店铺有优惠</p>
          <div class="modal-actions">
            <button class="btn-secondary" id="retryBtn">再抽一次</button>
            <button class="btn-primary" id="acceptBtn">就它了</button>
          </div>
        </div>
      </div>
    </div>

    <section class="categories-section" id="mainContent">
      <div class="section-header">
        <h2 class="section-title">热门分类</h2>
        <a href="discover.html" class="section-more">全部 ›</a>
      </div>
      <div class="categories-grid" id="categoriesGrid"></div>
    </section>

    <section class="deals-section" id="dealsSection">
      <div class="section-header">
        <h2 class="section-title">今日特惠</h2>
        <span class="section-badge">省最多</span>
      </div>
      <div class="deals-list" id="dealsList">
        <div class="skeleton-list">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="discover.html" class="nav-item" data-page="discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <span>发现</span>
      </a>
      <a href="coupons.html" class="nav-item" data-page="coupons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 12h20"/></svg>
        <span>优惠券</span>
      </a>
      <a href="profile.html" class="nav-item" data-page="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/address-store.js"></script>
  <script src="js/location-store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/platforms.js"></script>
  <script src="js/lottery.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
